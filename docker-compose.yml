version: "3.8"
services:
  db:
    image: postgres:15
    container_name: keep
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-GoogleKeep}
      POSTGRES_DB: ${POSTGRES_DB:-keep}
    ports:
      - "5432:5432"
    volumes:
      - keep-data:/var/lib/postgresql/data

volumes:
  keep-data:
